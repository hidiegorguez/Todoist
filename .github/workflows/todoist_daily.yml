name: Todoist Daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download es_core_news_sm

      - name: Runtime diagnostics
        run: |
          echo "[diag] UTC now: $(date -u)"
          echo "[diag] ref: $GITHUB_REF"
          echo "[diag] actor: $GITHUB_ACTOR"
          python --version
          pip --version

      - name: Run TodoistDaily
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          DIEGO_EMAIL: ${{ secrets.DIEGO_EMAIL }}
          ECLIPSE_EMAIL: ${{ secrets.ECLIPSE_EMAIL }}
          ECLIPSE_APP_PASSWORD: ${{ secrets.ECLIPSE_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import traceback
          from main import MainDiego

          print(f"[TodoistDaily] start UTC={datetime.datetime.utcnow().isoformat()}Z")
          try:
              main = MainDiego(todoist_api_token=os.getenv('TODOIST_API_TOKEN'))
              result = main.TodoistDaily(address=os.getenv('DIEGO_EMAIL'))
              print(f"[TodoistDaily] result: {result}")
              print("[TodoistDaily] completed")
          except Exception as exc:
              print(f"[TodoistDaily] failed: {exc}")
              traceback.print_exc()
              raise
          PY

      - name: Commit updated similar tasks CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/similartasksdiego.csv
          git diff --staged --quiet || git commit -m "chore: update similar tasks [skip ci]"
          git push
