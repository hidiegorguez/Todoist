name: Todoist Daily

on:
  schedule:
    # Avoid the top-of-the-hour minute (":00"), which is the most congested slot on GitHub Actions.
    - cron: '53 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Runtime diagnostics
        run: |
          echo "[diag] UTC now: $(date -u)"
          echo "[diag] ref: $GITHUB_REF"
          echo "[diag] actor: $GITHUB_ACTOR"
          python --version
          pip --version

      - name: Run TodoistDaily
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          DIEGO_EMAIL: ${{ secrets.DIEGO_EMAIL }}
          ECLIPSE_EMAIL: ${{ secrets.ECLIPSE_EMAIL }}
          ECLIPSE_APP_PASSWORD: ${{ secrets.ECLIPSE_APP_PASSWORD }}
          SIMILAR_TASKS_ENCRYPTION_KEY: ${{ secrets.SIMILAR_TASKS_ENCRYPTION_KEY }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import traceback
          from todoist_automation.api.todoist_client import TodoistFunctions
          from todoist_automation.automations import daily

          print(f"[TodoistDaily] start UTC={datetime.datetime.utcnow().isoformat()}Z")
          try:
              tf = TodoistFunctions(api_token=os.getenv('TODOIST_API_TOKEN'))
              result = daily.run_daily(tf, address=os.getenv('DIEGO_EMAIL'))
              print(f"[TodoistDaily] result: {result}")
              print("[TodoistDaily] completed")
          except Exception as exc:
              print(f"[TodoistDaily] failed: {exc}")
              traceback.print_exc()
              raise
          PY

      - name: Commit updated similar tasks CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/similartasksdiego.csv
          git diff --staged --quiet || git commit -m "chore: update similar tasks [skip ci]"
          git push
