name: Todoist Daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download es_core_news_sm

      - name: Run TodoistDaily
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          DIEGO_EMAIL: ${{ secrets.DIEGO_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -c "
import os
from main import MainDiego
main = MainDiego(todoist_api_token=os.getenv('TODOIST_API_TOKEN'))
print(main.TodoistDaily(address=os.getenv('DIEGO_EMAIL')))
"

      - name: Commit updated similar tasks CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/similartasksdiego.csv
          git diff --staged --quiet || git commit -m "chore: update similar tasks [skip ci]"
          git push
