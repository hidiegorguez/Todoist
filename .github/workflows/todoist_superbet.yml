name: Todoist SuperBet

on:
  schedule:
    - cron: '53 10 * * *'
    - cron: '53 14 * * *'
    - cron: '53 16 * * *'
  workflow_dispatch:
    inputs:
      scheduled_hour:
        description: 'UTC hour this SuperBet run represents'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Runtime diagnostics
        run: |
          echo "[diag] UTC now: $(date -u)"
          echo "[diag] ref: $GITHUB_REF"
          echo "[diag] actor: $GITHUB_ACTOR"
          python --version
          pip --version

      - name: Run TodoistSuperBet
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          SCHEDULED_HOUR: ${{ inputs.scheduled_hour }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import traceback
          from todoist_automation.api.todoist_client import TodoistFunctions
          from todoist_automation.automations import superbet

          print(f"[TodoistSuperBet] start UTC={datetime.datetime.utcnow().isoformat()}Z")
          try:
              tf = TodoistFunctions(api_token=os.getenv('TODOIST_API_TOKEN'))
              scheduled_hour = os.getenv('SCHEDULED_HOUR')
              if scheduled_hour:
                if scheduled_hour not in {'10', '14', '16'}:
                  raise ValueError(f"Unsupported scheduled_hour: {scheduled_hour}")
                hour = int(scheduled_hour)
              else:
                hour = datetime.datetime.now(datetime.timezone.utc).hour
              print(f"[TodoistSuperBet] evaluation hour(UTC): {hour}")
              result = superbet.run_superbet(tf, hour=hour)
              print(f"[TodoistSuperBet] result: {result}")
              print("[TodoistSuperBet] completed")
          except Exception as exc:
              print(f"[TodoistSuperBet] failed: {exc}")
              traceback.print_exc()
              raise
          PY
